# Copy to livemap.toml (or just run livemap: the setup page writes it for you).

# SPP repack: logs, DBC files, databases and aiplayerbot.conf are found per core from here.
spp_root = "C:/Games/SPP_Classics_V2/SPP_Server"

[server]
host = "127.0.0.1"
port = 8420
data_dir = "data"
require_token_local = false
allow_remote_write = false
# the online demo page may connect to this livemap (token always required, changes always off)
pages_origin = "https://mostlikely4r.github.io"

[map]
keep_cache = false
cache_mb = 500
shading = "soft"
render_workers = 2
fallback = true
fallback_order = ["tbc", "vanilla"]

[[core]]
name = "vanilla"
client = "C:/Games/WoW-Classic/Data"

[[core]]
name = "tbc"
client = "C:/Games/WoW-TBC/Data"

[[core]]
name = "wotlk"
client = "C:/Games/WoW-WotLK/Data"

# Any other CMaNGOS or vmangos server: mangosd.conf is enough (databases, logs, dbc, aiplayerbot.conf).
# [[core]]
# name = "vmangos"
# mangosd_conf = "C:/vmangos/mangosd.conf"
